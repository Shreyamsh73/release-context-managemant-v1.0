[project]
name = "context-gateway"
version = "0.1.0"
description = "Self-hosted, plug-and-play memory gateway for apps that call LLM APIs directly."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Shreyamsh" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "redis>=5.0",
    "procrastinate>=3.5",
    # Pinned exactly in uv.lock with hashes. Review release notes before upgrading:
    # 1.82.7 and 1.82.8 were malicious uploads (March 2026 supply-chain incident).
    "litellm>=1.83",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "fakeredis>=2.23",
    "testcontainers[postgres,redis]>=4.7",
]

[project.scripts]
context-gateway = "context_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs real Postgres/Redis (TEST_DATABASE_URL / TEST_REDIS_URL or Docker)",
]
